[project]
name = "eggnoxx"
dynamic = ["version"]
description = "Minimalistische Schwarz-Weiß-Eieruhr im Retro-Pixel-Look"
readme = "README.md"
# Upper bound is not ours: PySide6 6.11 declares ">=3.10,<3.15". Declaring it
# here too means a 3.15 install fails immediately naming this project instead
# of dying somewhere inside the PySide6 resolver.
requires-python = ">=3.10,<3.15"
dependencies = ["pyside6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
eggnoxx = "eggnoxx.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

# Single source of truth: __init__.py. The other direction would make
# __version__ depend on the package being installed, so it would stop working in
# a plain source checkout.
[tool.hatch.version]
path = "eggnoxx/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["eggnoxx"]
# Bundled assets have to travel with the wheel: without the pixel font the app
# falls back to the system font, without the sound it falls back to the bell.
artifacts = [
    "eggnoxx/assets/fonts/*.ttf",
    "eggnoxx/assets/icons/*",
    "eggnoxx/assets/sounds/*.wav",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"