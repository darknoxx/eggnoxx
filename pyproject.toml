[project]
name = "eggnoxx"
version = "0.2.0"
description = "Minimalistische Schwarz-Weiß-Eieruhr im Retro-Pixel-Look"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyside6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
eggnoxx = "eggnoxx.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eggnoxx"]
# Bundled assets have to travel with the wheel: without the pixel font the app
# falls back to the system font, without the sound it falls back to the bell.
artifacts = [
    "eggnoxx/assets/fonts/*.ttf",
    "eggnoxx/assets/icons/*",
    "eggnoxx/assets/sounds/*.wav",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"