[project]
name = "eggnoxx"
version = "0.2.0"
description = "Minimalistische Schwarz-Weiß-Eieruhr im Retro-Pixel-Look"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyside6>=6.5"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4"]

[project.scripts]
eggnoxx = "eggnoxx.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["eggnoxx"]
# The bundled pixel font has to travel with the wheel, otherwise the app falls
# back to the system monospace font after installation.
artifacts = ["eggnoxx/assets/fonts/*.ttf", "eggnoxx/assets/icons/*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"